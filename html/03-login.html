<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexo | Login</title>

    <link rel="stylesheet" href="../css/login.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <section>
        <img
            class="logo"
            src="../img/projeto%20nexo%20img.jpeg"
            alt="Logo do Nexo"
        >

        <h1>Nexo</h1>
        <p class="subtitle">Que ótimo te ver de novo!</p>
        <p>Faça login para continuar</p>
    </section>

    <div class="login-card">
        <form id="loginForm">
            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Seu melhor email"
                autocomplete="email"
                required
            >

            <label for="password">Senha</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Crie uma senha"
                autocomplete="current-password"
                required
            >

            <label for="remember">
                <input type="checkbox" id="remember" name="remember">
                Lembre de mim
            </label>

            <p>
                <a href="forgot-password.html">Esqueceu sua senha?</a>
            </p>

            <button type="submit">Entrar</button>

            <p>ou</p>

            <div class="google-signin">
                <div
                    id="g_id_onload"
                    data-client_id="COLE_AQUI_SEU_CLIENT_ID_REAL"
                    data-callback="handleCredentialResponse">
                </div>

                <div
                    class="g_id_signin"
                    data-type="standard"
                    data-shape="pill"
                    data-theme="outline"
                    data-text="continue_with"
                    data-size="large"
                    data-locale="pt-BR">
                </div>
            </div>

            <p>
                Não tem uma conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>
        </form>
    </div>

    <script>
        function handleCredentialResponse(response) {
            console.log("Resposta de login recebida do Google.");
            // Para autenticar o usuário de verdade, valide o token no servidor.
        }
    </script>
</body>
</html>

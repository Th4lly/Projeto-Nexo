
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexo || Cadastro</title>

    <!-- Logo na aba do navegador -->
    <link rel="icon" type="image/jpeg" href="../img/projeto%20nexo%20img.jpeg">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/cadastro.css">

    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <main class="register-page">

        <section class="register-container">

            <section class="register-card">

                <!-- APRESENTAÇÃO DO NEXO -->

                <div class="apresentacao">

                    <img
                        src="../img/projeto%20nexo%20img.jpeg"
                        alt="Logo Nexo"
                        class="logo-nexo"
                    >

                    <h1>Nexo</h1>

                </div>

                <!-- TEXTO DE APRESENTAÇÃO -->

                <div class="texto-cadastro">

                    <h2 class="titulo-desktop">
                        Que bom que decidiu se conhecer melhor.
                    </h2>

                    <h2 class="titulo-mobile">
                        Crie sua conta
                    </h2>

                    <p class="subtitle">
                        E por que não começar pelo básico?
                    </p>

                </div>

                <!-- FORMULÁRIO -->

                <form id="registerForm" method="post">

                    <label for="fullName">Nome completo</label>

                    <div class="input-icon">

                        <i class="bi bi-person"></i>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Como se chama?"
                            autocomplete="name"
                            required
                        >

                    </div>

                    <label for="pronoun">Pronome</label>

                    <div class="input-icon">

                        <i class="bi bi-gender-ambiguous"></i>

                        <select id="pronoun" name="pronoun" required>

                            <option value="" selected disabled>
                                Selecione seu pronome
                            </option>

                            <option value="ele/dele">Ele/dele</option>
                            <option value="ela/dela">Ela/dela</option>
                            <option value="elu/delu">Elu/delu</option>
                            <option value="nao-informar">Prefiro não informar</option>

                        </select>

                    </div>

                    <!-- DATA DE NASCIMENTO -->

                    <fieldset class="birth-field">

                        <legend>Data de nascimento</legend>

                        <div class="birth-row">

                            <div class="birth-input">

                                <i class="bi bi-calendar3"></i>

                                <select id="dia" name="dia" aria-label="Dia de nascimento" required>
                                    <option value="" selected disabled>Dia</option>
                                </select>

                            </div>

                            <div class="birth-input">

                                <select id="mes" name="mes" aria-label="Mês de nascimento" required>

                                    <option value="" selected disabled>Mês</option>

                                    <option value="1">01</option>
                                    <option value="2">02</option>
                                    <option value="3">03</option>
                                    <option value="4">04</option>
                                    <option value="5">05</option>
                                    <option value="6">06</option>
                                    <option value="7">07</option>
                                    <option value="8">08</option>
                                    <option value="9">09</option>
                                    <option value="10">10</option>
                                    <option value="11">11</option>
                                    <option value="12">12</option>

                                </select>

                            </div>

                            <div class="birth-input">

                                <select id="ano" name="ano" aria-label="Ano de nascimento" required>
                                    <option value="" selected disabled>Ano</option>
                                </select>

                            </div>

                        </div>

                    </fieldset>

                    <!-- CPF -->

                    <label for="cpf">CPF</label>

                    <div class="input-icon">

                        <i class="bi bi-person-vcard"></i>

                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            placeholder="000.000.000-00"
                            maxlength="14"
                            inputmode="numeric"
                            required
                        >

                    </div>

                    <!-- E-MAIL -->

                    <label for="email">Email</label>

                    <div class="input-icon">

                        <i class="bi bi-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Seu melhor email"
                            autocomplete="email"
                            required
                        >

                    </div>

                    <!-- SENHA -->

                    <label for="password">Senha</label>

                    <div class="password-box">

                        <i class="bi bi-lock"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Crie uma senha"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            aria-label="Mostrar senha"
                        >
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                    <p id="feedback" class="feedback" aria-live="polite"></p>

                </form>

                <!-- BOTÕES E LINKS -->

                <div class="acoes-cadastro">

                    <button
                        type="submit"
                        form="registerForm"
                        class="submit-button"
                    >
                        Cadastrar
                    </button>

                    <p class="login-link">

                        Já tem uma conta?

                        <a href="03-login.html" id="loginLink">
                            Entrar
                        </a>

                    </p>

                </div>

            </section>

        </section>

    </main>

    <!-- JavaScript -->
    <script src="../js/cadastro.js"></script>

</body>
</html>
